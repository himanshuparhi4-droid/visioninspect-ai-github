services:
  - type: web
    name: visioninspect-ai-backend
    env: python
    plan: free
    region: singapore
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: APP_NAME
        value: VisionInspect AI
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: MONGODB_DATABASE
        value: visioninspect_ai
      - key: CLASSIFIER_MODEL_PATH
        value: ../models/defect_classifier.pkl
      - key: MODEL_METADATA_PATH
        value: ../models/model_metadata.json
      - key: BASELINE_THRESHOLD
        value: "1.34"
      - key: USE_PADIM_INFERENCE
        value: "false"
      - key: USE_OPENVINO_INFERENCE
        value: "true"
      - key: OPENVINO_INFERENCE_DEVICE
        value: CPU
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OPENCV_NUM_THREADS
        value: "2"
      - key: WARM_MODEL_ON_STARTUP
        value: "true"
      - key: PADIM_INFERENCE_ACCELERATOR
        value: cpu
      - key: UPLOAD_DIR
        value: app/uploads
      - key: SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: USE_CLOUDINARY_STORAGE
        value: "true"
      - key: CLOUDINARY_TIMEOUT_SECONDS
        value: "20"
